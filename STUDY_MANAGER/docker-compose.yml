services:
  study-manager:
    build:
      context: .
    container_name: study-manager
    ports:
      - "8443:8443"
    volumes:
      - ./output:/app/output           # Persistência do banco de dados CloverDB
      - ../:/app/notes                 # Mapeia o vault do Obsidian (um nível acima)
      - .env:/app/.env                # Arquivo de configuração
      - ~/.gemini:/root/.gemini       # Credenciais do Gemini CLI
    environment:
      - PORT=8443
      - VAULT_PATH=/app/notes
      - DB_PATH=/app/output/clover_db
      - GEMINI_CLI_TRUST_WORKSPACE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 10s
      retries: 3

services:
  db:
    image: postgres:15-alpine
    container_name: study-manager-db
    environment:
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_password
      POSTGRES_DB: study_db
    volumes:
      - ./output/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_user -d study_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  study-manager:
    build:
      context: .
    container_name: study-manager
    ports:
      - "8443:8443"
    volumes:
      - ./output:/app/output           # Persistência do banco de dados CloverDB
      - ../:/app/notes                 # Mapeia o vault do Obsidian (um nível acima)
      - .env:/app/.env                # Arquivo de configuração
      - ~/.gemini:/root/.gemini       # Credenciais do Gemini CLI
    environment:
      - PORT=8443
      - VAULT_PATH=/app/notes
      - DATABASE_URL=postgres://study_user:study_password@db:5432/study_db?sslmode=disable
      - GEMINI_CLI_TRUST_WORKSPACE=true
      - TERM=xterm-256color
      - NO_COLOR=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

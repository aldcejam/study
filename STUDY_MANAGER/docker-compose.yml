services:
  db:
    image: postgres:15-alpine
    container_name: study-manager-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ${PATH_OUTPUT}/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  study-manager:
    build:
      context: .
    container_name: study-manager
    ports:
      - "8443:8443"
    volumes:
      - ${PATH_OUTPUT}:/app/output           # Persistência
      - ${PATH_NOTES}:/app/notes                 # Mapeia o vault do Obsidian
      - ${PATH_ENV}:/app/.env                # Arquivo de configuração
      - ${PATH_GEMINI}:/root/.gemini       # Credenciais do Gemini CLI
    environment:
      - PORT=8443
      - VAULT_PATH=/app/notes
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - GEMINI_CLI_TRUST_WORKSPACE=true
      - TERM=xterm-256color
      - NO_COLOR=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8443"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

name: 📚 Study Manager Pipeline (Go)

on:
  push:
    paths:
      - '**/*.md'
      - 'STUDY_MANAGER/**'
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para salvar o cache de volta no repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa todo o histórico para o git log funcionar

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: STUDY_MANAGER/go.mod

      - name: 🚀 Run Study Pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Cria o .env temporário para o notifier (opcional se passarmos via env, mas o script atual lê o arquivo)
          echo "TELEGRAM_TOKEN=$TELEGRAM_TOKEN" > STUDY_MANAGER/.env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> STUDY_MANAGER/.env
          
          # Garante permissões e executa
          chmod +x STUDY_MANAGER/scripts/pipeline.sh
          cd STUDY_MANAGER
          bash scripts/pipeline.sh

      - name: 💾 Persist Cache & Metadata
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Adiciona apenas os arquivos de saída do gerenciador
          git add STUDY_MANAGER/output/revisoes_METADATA.json || true
          
          # Commit apenas se houver mudanças nos metadados
          if [ -n "$(git status --porcelain STUDY_MANAGER/output/)" ]; then
            git commit -m "chore: update study metadata and cache (Go) [skip ci]"
            git push
          else
            echo "Nenhuma alteração de metadados para salvar."
          fi

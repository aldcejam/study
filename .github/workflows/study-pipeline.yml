name: 📚 Study Manager Pipeline

on:
  push:
    paths:
      - '**/*.md'
      - '__MANAGER__/**'
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para salvar o cache de volta no repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa todo o histórico para o git log funcionar

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r __MANAGER__/requirements.txt
          pip install pytest # Instalado para rodar os testes

      - name: 🧪 Run Tests
        run: |
          # Define PYTHONPATH para que os testes encontrem os módulos
          export PYTHONPATH=$PYTHONPATH:$(pwd)/__MANAGER__/study-metadata-generator
          pytest __MANAGER__/tests/

      - name: 🚀 Run Study Pipeline
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          # Garante permissões de execução
          chmod +x __MANAGER__/*.sh
          chmod +x __MANAGER__/study-metadata-generator/*.py
          
          # Executa a pipeline
          cd __MANAGER__
          ./pipeline.sh

      - name: 💾 Persist Cache & Metadata
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Adiciona apenas os arquivos de saída do gerenciador
          git add __MANAGER__/output/revisoes_METADATA.json || true
          
          # Commit apenas se houver mudanças nos metadados
          if [ -n "$(git status --porcelain __MANAGER__/output/)" ]; then
            git commit -m "chore: update study metadata and cache [skip ci]"
            git push
          else
            echo "Nenhuma alteração de metadados para salvar."
          fi
